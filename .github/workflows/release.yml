name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run gen:zod && git diff --exit-code src/protect/schemas.ts
      - run: npm test
      - run: npm run build

  # Everything that runs project or dependency code (install scripts, build) happens here
  # with a read-only token and no OIDC identity. The Publish job only uploads the tarball
  # built here. package.json is the version authority.
  package:
    name: Package
    needs: test
    if: github.repository == 'tinkerologie/homebridge-unifi-protect-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository and read releases
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Inspect release state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"

          node scripts/release-notes.mjs "$VERSION" "$NOTES"

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$NOTES" >> "$GITHUB_OUTPUT"

          NPM_METADATA="$RUNNER_TEMP/npm-metadata-$VERSION.json"
          if ! NPM_STATUS="$(curl --silent --show-error --output "$NPM_METADATA" \
            --write-out '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"; then
            echo "::error title=npm registry check failed::Could not query the npm registry."
            exit 1
          fi
          case "$NPM_STATUS" in
            200) PUBLISHED=true ;;
            404) PUBLISHED=false ;;
            *)
              echo "::error title=npm registry check failed::Unexpected HTTP status $NPM_STATUS."
              exit 1
              ;;
          esac

          set +e
          git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" > /dev/null 2>&1
          TAG_STATUS=$?
          set -e
          case "$TAG_STATUS" in
            0) TAGGED=true ;;
            2) TAGGED=false ;;
            *)
              echo "::error title=Git tag check failed::git ls-remote exited with status $TAG_STATUS."
              exit "$TAG_STATUS"
              ;;
          esac

          RELEASE_RESPONSE="$RUNNER_TEMP/github-release-$VERSION.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error --output "$RELEASE_RESPONSE" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"; then
            echo "::error title=GitHub release check failed::Could not query the GitHub releases API."
            exit 1
          fi
          case "$RELEASE_STATUS" in
            200) RELEASED=true ;;
            404) RELEASED=false ;;
            *)
              echo "::error title=GitHub release check failed::Unexpected HTTP status $RELEASE_STATUS."
              exit 1
              ;;
          esac

          printf 'published=%s\n' "$PUBLISHED" >> "$GITHUB_OUTPUT"
          printf 'tagged=%s\n' "$TAGGED" >> "$GITHUB_OUTPUT"
          printf 'released=%s\n' "$RELEASED" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release state::version=$VERSION published=$PUBLISHED tagged=$TAGGED released=$RELEASED"

          if [[ "$TAGGED" == true && "$PUBLISHED" == false ]]; then
            echo "::error title=Invalid release state::Tag v$VERSION exists, but $NAME@$VERSION is not published to npm."
            exit 1
          fi

          if [[ "$PUBLISHED" == true && "$TAGGED" == false ]]; then
            echo "::notice title=Verifying published source::Rebuilding $NAME@$VERSION before creating its tag."
            npm install -g npm@latest
            npm ci
            npm run build

            PACK_RESULT="$RUNNER_TEMP/npm-pack-$VERSION.json"
            npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$PACK_RESULT"
            if ! LOCAL_INTEGRITY="$(node -p \
              "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0].integrity" \
              "$PACK_RESULT")"; then
              echo "::error title=Source identity check failed::Could not read the rebuilt package integrity."
              exit 1
            fi
            if ! PUBLISHED_INTEGRITY="$(node -p \
              "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).dist?.integrity ?? ''" \
              "$NPM_METADATA")"; then
              echo "::error title=Source identity check failed::Could not read the published package integrity."
              exit 1
            fi
            if [[ -z "$PUBLISHED_INTEGRITY" || "$LOCAL_INTEGRITY" != "$PUBLISHED_INTEGRITY" ]]; then
              echo "::error title=Source identity mismatch::Published package bytes do not match commit $GITHUB_SHA."
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        run: npm ci

      # The Test job already ran lint, the schema check and tests on this commit; build the
      # dist/ that ships. --ignore-scripts keeps prepublishOnly and prepack from running again.
      - name: Build and pack the package
        if: steps.check.outputs.published == 'false'
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"

      - name: Add the release notes
        if: steps.check.outputs.published == 'false' || steps.check.outputs.released == 'false'
        env:
          NOTES: ${{ steps.check.outputs.notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$NOTES" "$RUNNER_TEMP/release/release-notes.md"

      - name: Hand the package to the Publish job
        if: steps.check.outputs.published == 'false' || steps.check.outputs.released == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed Publish job

  # The only job with write access and an OIDC identity. It does not check out the
  # repository or install anything: it publishes the tarball the Package job built.
  # npm trusted publishing is bound to this workflow filename (release.yml) and the
  # release environment.
  publish:
    name: Publish
    needs: package
    if: needs.package.outputs.published == 'false' || needs.package.outputs.released == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing (OIDC) to npm, with provenance
      contents: write # create the GitHub release and tag
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.package.outputs.published == 'false'
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+. Node 24 bundles a new enough npm, so check it
      # rather than install anything in this job.
      - name: Check npm supports trusted publishing
        if: needs.package.outputs.published == 'false'
        run: |
          NPM_VERSION="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$NPM_VERSION"; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      # A retried or racing run can find the version already on npm (published by an earlier
      # attempt). Skip the publish then instead of failing, so the release step still runs.
      - name: Check npm does not have this version yet
        id: npm
        if: needs.package.outputs.published == 'false'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          NAME="$(tar -xzOf ./release/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
          case "$STATUS" in
            200)
              echo "::notice::$NAME@$VERSION is already on npm; skipping the publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected HTTP status $STATUS from the npm registry."
              exit 1
              ;;
          esac

      # --ignore-scripts: nothing from the package runs in this job.
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish ./release/*.tgz --access public --ignore-scripts

      - name: Create GitHub release
        if: needs.package.outputs.released == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
