<style>
  .up-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .up-card { border: 1px solid rgba(128,128,128,.3); border-radius: 6px; padding: .75rem; margin-bottom: .5rem; }
  .up-muted { opacity: .7; font-size: .85rem; }
  .up-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .25rem .75rem; }
  .up-warn { border-color: #b23; }
  .up-fp { font-family: monospace; font-size: .8rem; word-break: break-all; }
</style>

<div class="up-row">
  <label for="host">Console</label>
  <input class="form-control" id="host" placeholder="192.168.1.1" style="max-width: 14rem">
  <label for="apiKey">API Key</label>
  <input class="form-control" id="apiKey" type="password" style="max-width: 20rem">
  <button class="btn btn-primary" id="test" type="button">Test Connection</button>
</div>

<div class="up-row up-muted" id="status" aria-live="polite"></div>
<div id="trust" aria-live="polite"></div>

<!--
  Host-wide settings, as opposed to the per-camera ones on each device card
  below. Static markup only: every value here is typed by the user or read back
  from their own config, never supplied by the console.
-->
<div class="up-card">
  <div><strong>Live view</strong> <span class="up-muted">applies to the whole host</span></div>
  <div class="up-row">
    <label for="maxStreams">Maximum concurrent live views</label>
    <input class="form-control" id="maxStreams" type="number" min="1" max="16" step="1" placeholder="auto" style="max-width: 6rem">
    <span class="up-muted">Blank picks from the encoder found: 6 with hardware, 2 with software.</span>
  </div>
  <div class="up-row">
    <label for="ffmpegPath">ffmpeg path</label>
    <input class="form-control" id="ffmpegPath" placeholder="auto-detect" style="max-width: 20rem">
    <span class="up-muted">Blank searches /usr/bin, /usr/local/bin, then PATH.</span>
  </div>
</div>

<div id="devices"></div>

<script type="module">
  import { AUDIO_LABEL, ensureConfig, parseMaxStreams, renderDeviceHeader, renderQualitySelect, setDeviceSetting, setGlobalSetting } from './config-ops.js'

  const statusEl = document.getElementById('status')
  const trustEl = document.getElementById('trust')
  const devicesEl = document.getElementById('devices')
  const hostEl = document.getElementById('host')
  const keyEl = document.getElementById('apiKey')

  let config = ensureConfig((await homebridge.getPluginConfig())[0])
  hostEl.value = config.host
  keyEl.value = config.apiKey

  const save = async () => {
    await homebridge.updatePluginConfig([config])
    await homebridge.savePluginConfig()
  }

  const settingOf = (id, key, fallback) => config.devices[id]?.[key] ?? fallback

  // Host-wide settings. Populated from the saved config and written straight
  // back, so neither of them needs config.json to be edited by hand.
  const maxStreamsEl = document.getElementById('maxStreams')
  const ffmpegPathEl = document.getElementById('ffmpegPath')
  maxStreamsEl.value = config.maxStreams ?? ''
  ffmpegPathEl.value = config.ffmpegPath ?? ''

  maxStreamsEl.addEventListener('change', async () => {
    const value = parseMaxStreams(maxStreamsEl.value)
    // Echo back what was actually stored: an out-of-range entry is dropped, and
    // leaving the rejected number sitting in the box would claim otherwise.
    maxStreamsEl.value = value ?? ''
    config = setGlobalSetting(config, 'maxStreams', value)
    await save()
  })

  ffmpegPathEl.addEventListener('change', async () => {
    const value = ffmpegPathEl.value.trim()
    ffmpegPathEl.value = value
    config = setGlobalSetting(config, 'ffmpegPath', value)
    await save()
  })

  function render(devices) {
    devicesEl.replaceChildren()
    for (const device of devices) {
      const card = document.createElement('div')
      card.className = 'up-card'
      // device.name/device.type are console-supplied — never innerHTML them.
      card.append(...renderDeviceHeader(document, device))

      const grid = document.createElement('div')
      grid.className = 'up-grid'

      const toggle = (key, label, fallback, comingLater) => {
        const id = `${device.id}-${key}`
        const wrap = document.createElement('label')
        wrap.setAttribute('for', id)
        // id embeds device.id (console-supplied) — build with DOM APIs, never innerHTML.
        const input = document.createElement('input')
        input.type = 'checkbox'
        input.id = id
        wrap.append(input, ` ${label}`)
        input.checked = Boolean(settingOf(device.id, key, fallback))
        if (comingLater) {
          // Shown, but inert and said so plainly. This release has no camera
          // services yet, so honouring the flag is impossible — offering a
          // live checkbox that quietly does nothing would be the dishonest
          // option, and hiding it entirely hides the roadmap.
          // Sub-project 2 must drop `comingLater` when the services land, or
          // the settings stay permanently unreachable. Note also that a
          // hand-edited `hksv: true` renders checked-but-disabled and cannot
          // be cleared here — harmless while nothing reads it, but it must not
          // outlive this release.
          input.disabled = true
          wrap.className = 'up-muted'
          wrap.append(' — arriving in a later release')
        }
        else {
          input.addEventListener('change', async () => {
            config = setDeviceSetting(config, device.id, key, input.checked)
            await save()
          })
        }
        grid.append(wrap)
      }

      toggle('expose', 'Expose in HomeKit', config.defaults.exposeNewDevices)
      // Capability-driven: a control is only offered when the hardware can
      // honour it, so the UI never lets someone flip a setting that will
      // silently do nothing.
      if (device.type === 'camera') {
        // Live and enabled, unlike hksv/talkback below: both of these genuinely
        // work now, so a disabled control would be the dishonest one.
        const { wrap, select } = renderQualitySelect(document, device, settingOf(device.id, 'quality', config.defaults.quality))
        select.addEventListener('change', async () => {
          config = setDeviceSetting(config, device.id, 'quality', select.value)
          await save()
        })
        grid.append(wrap)
        if (device.hasMic)
          toggle('audio', AUDIO_LABEL, false)
        toggle('hksv', 'HomeKit Secure Video', config.defaults.hksv, true)
        if (device.hasSpeaker)
          toggle('talkback', 'Two-way audio', false, true)
      }

      card.append(grid)
      devicesEl.append(card)
    }
  }

  /**
   * Every line here is built with DOM APIs and lands as `textContent`.
   * Fingerprints and hostnames come from whatever answered on the network —
   * treat them as attacker-controlled and NEVER interpolate them into markup.
   */
  function renderTrust(lines, { warn = false, retrust = null } = {}) {
    trustEl.replaceChildren()
    if (lines.length === 0)
      return
    const card = document.createElement('div')
    card.className = warn ? 'up-card up-warn' : 'up-card up-muted'
    for (const line of lines) {
      const p = document.createElement('div')
      if (line.fingerprint)
        p.className = 'up-fp'
      p.textContent = line.text
      card.append(p)
    }
    if (retrust) {
      const button = document.createElement('button')
      button.className = 'btn btn-danger'
      button.type = 'button'
      button.textContent = 'Trust this certificate'
      // Deliberate, explicit, one click that the user has to find and press —
      // the plugin itself never re-trusts on its own.
      button.addEventListener('click', async () => {
        config = { ...config, consoleCert: retrust }
        await save()
        renderTrust([{ text: 'The new certificate is now trusted. Restart Homebridge, then press Test Connection.' }])
      })
      card.append(button)
    }
    trustEl.append(card)
  }

  if (config.consoleCert)
    renderTrust([{ text: 'This console\'s certificate is trusted and pinned. Press Test Connection to verify it still matches.' }])

  document.getElementById('test').addEventListener('click', async () => {
    statusEl.textContent = 'Checking the console\'s certificate…'
    // The key is only ever sent to the local server-side handler over the
    // homebridge IPC channel — never logged, never echoed back into the DOM.
    config = { ...config, host: hostEl.value.trim(), apiKey: keyEl.value.trim() }

    // Certificate first, credential second: nothing below sends the API key
    // until the certificate on the wire is the one this install trusts.
    let cert
    try {
      cert = await homebridge.request('/console-cert', { host: config.host, consoleCert: config.consoleCert })
    }
    catch (error) {
      statusEl.textContent = error.message
      return
    }

    if (cert.matches === false) {
      statusEl.textContent = 'Refused to connect — the console\'s certificate changed. The API key was not sent.'
      renderTrust([
        { text: `The certificate presented by ${config.host} does not match the one this plugin trusts, so the connection was refused before the API key was sent.` },
        { text: `Trusted: ${cert.trustedFingerprint}`, fingerprint: true },
        { text: `Presented: ${cert.fingerprint}`, fingerprint: true },
        { text: 'If you know why it changed — the console was reinstalled, reset, or its certificate regenerated — trust the new one below. If you do not, treat this as an interception attempt and do not trust it.' },
      ], { warn: true, retrust: cert.pem })
      return
    }

    if (cert.matches === null) {
      config = { ...config, consoleCert: cert.pem }
      renderTrust([
        { text: `Now trusting this console's certificate. Compare it with the fingerprint your console shows if you want to be certain — every later connection is pinned to it.` },
        { text: `SHA-256: ${cert.fingerprint}`, fingerprint: true },
      ])
    }

    statusEl.textContent = 'Connecting…'
    const credentials = { host: config.host, apiKey: config.apiKey, consoleCert: config.consoleCert }
    try {
      const info = await homebridge.request('/test-connection', credentials)
      statusEl.textContent = `Connected — ${info.nvrName}, Protect ${info.version}`
      await save()
      const { devices } = await homebridge.request('/discover', credentials)
      render(devices)
    }
    catch (error) {
      statusEl.textContent = error.message
    }
  })
</script>
